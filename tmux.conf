# created by @AkytharPandaaa
# inspired by https://www.josean.com/posts/tmux-setup

# true colors
set -g default-terminal "screen-256color"
set -ga terminal-features ',xterm-kitty:RGB'
set -g terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -g terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  

# mouse
set -g mouse on

# history
set -g history-limit 42000

# escape time
set -g escape-time 10

# prefix
#unbind C-b
#set -g prefix C-a
#bind-key C-a send-prefix

# KEYBINDS: window
unbind %
unbind h
bind h split-window -h

unbind '"'
unbind g
bind g split-window -v

unbind x
bind x kill-pane

unbind m
bind m resize-pane -Z

# KEYBINDS: config reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christookey/vim-tmux-navigator' # vim navigation in tmux
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
#set -g @plugin 'tmux-plugins/tmux-cpu' # cpu and gpu status
set -g @plugin 'tmux-plugins/tmux-battery' # battery status
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name' # nerd-font icons on window names
set -g @plugin 'omerxx/tmux-sessionx'          # prefix + o
set -g @plugin 'catppuccin/tmux#v2.3.2'

# session saving settings
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# themes (inspired by https://github.com/catppuccin/tmux/discussions/317#discussioncomment-10890888)
set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# source the plugin here
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# set left and right status bar
set -g allow-rename off
set -g status-position bottom
set -g status-interval 15
set -g status-left-length 100
set -g status-right-length 100

# Status modules config
set -g @catppuccin_date_time_text " %H:%M"
set -g @catppuccin_host_text " #h"
#set -g @catppuccin_session_text ""

# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-left "#{E:@catppuccin_status_session}"

#set -agF status-right "#{E:@catppuccin_status_cpu}"
#set -agF status-right "#{E:@catppuccin_status_ram}"
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_host}"

# battery status linux
if 'test -r /sys/class/power_supply/BAT*' {
  set -agF status-right '#{E:@catppuccin_status_battery}'
}
# battery status macos
if "test -n '/usr/sbin/ioreg -c AppleSmartBattery -r | grep -i BatteryInstalled'" {
  if "test -n 'uname | grep -io darwin'" {
    set -agF status-right '#{E:@catppuccin_status_battery}'
  }
}
set -agF status-right "#{E:@catppuccin_status_date_time}"

# tpm init
run '~/.config/tmux/tpm/tpm'

