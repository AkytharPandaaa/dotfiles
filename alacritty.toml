[general]
live_config_reload = true
import = ["./themes/rose-pine/dist/rose-pine-moon.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = {x=2, y=2}
dynamic_padding = true
decorations = "None"
opacity = 1.0

[scrolling]
history = 42000

[font]
normal = {family="AnnotationM NF", style="Medium"}
size = 15

[cursor]
style = {shape="Block", blinking="Off"}
unfocused_hollow = true

[terminal]
shell = {program="/usr/bin/fish", args=[]}
osc52 = "CopyPaste"

[mouse]
hide_when_typing = true

# https://alacritty.org/config-alacritty.html#keyboard
