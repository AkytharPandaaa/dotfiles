# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0

workspace = 1, monitor:desc:ASUSTek COMPUTER INC VG34VQ3B S9LMTF025266, default:true
workspace = 2, monitor:desc:ASUSTek COMPUTER INC VG34VQ3B S9LMTF025266
workspace = 3, monitor:desc:ASUSTek COMPUTER INC VG34VQ3B S9LMTF025266
