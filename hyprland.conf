# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = name, disable
# hyprctl monitors 
monitor = DP-2, 3440x1440@60, 1080x0, 1 
monitor = DP-3, 1920x1080@60, 0x0, 1, transform, 1 
monitor = ,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
#$fileManager = nautilus --new-window
$fileManager = thunar
$menu = wofi --show
$launcher = fuzzel --config="$HOME/.config/fuzzel/fuzzel.ini"
$screenshot_area = hyprshot --output-folder "Bilder/Screenshots" --filename "Screenshot $(date +'%Y-%m-%d at %H-%M-%S') - $(hyprctl activewindow | grep -Po '(?<=title: ).+' | sed 's!/!_!g').png" --mode region --freeze
$browser = min 

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = systemctl --user start hyprpolkitagent  # GUI root password prompt
exec-once = swaync                                  # notifications
exec-once = waybar                                  # top info bar
exec-once = nextcloud                               # cloud sync
exec-once = keepassxc                               # passwords
exec-once = hyprpaper                               # wallpapers
exec-once = ferdium                                 # Messengers: Discord/Telegram/EpicGames
exec-once = Telegram -startintray                   # Telegram
exec-once = discord --start-minimized               # Discord
exec-once = steam -silent                           # steam
exec-once = syncthing                               # file sync
exec-once = uxplay                                  # uxplay: AirPlay server (virtual apple tv)
exec-once = wl-paste --type text --watch cliphist store # stores only text data
exec-once = wl-paste --type image --watch cliphist store # stores only image data

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32

# Nvidia settings
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # gaps_in = gaps between windows
    # gaps_out = gaps to monitor edges
    gaps_in = 2  # 20
    gaps_out = 0, 4, 4, 4 # (top, right, bottom, left)

    border_size = 2
    no_border_on_floating = false

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12
#    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0  # 1.0
    inactive_opacity = 1.0  # 1.0

    shadow {
        enabled = false  # true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false # true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# workspace = 1, monitor:eDP-1, gapsout:2
# workspace = 2, monitor:eDP-1, gapsout:0, rounding:false
# workspace = 3, monitor:eDP-1, gapsout:0, rounding:false

workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2

# windowrulev2 = workspace:2, class:(Ferdium), title:(Ferdium)
# windowrulev2 = workspace:3, .*(KeePassXC), title:(KeePassXC)

### Minecraft
windowrule = fullscreen, initialClass:^(Minecraft.+)$, initialTitle: ^(FML early loading progress)$

### Steam 
# Steam apps windowrules
windowrule = fullscreen, class:^(steam_app_[0-9]*)$   # steam games fullscreen
#windowrule = float, class:^(steam_app_1623730)$, title:^(Pal Crash Reporter)$  # Palworld crash report # match not working, possibly due to fullscreen match

# Steam updater
windowrule = float, title:^(Steam)$, class:^()$
windowrule = noinitialfocus, title:^(Steam)$, class:^()$
windowrule = move onscreen 85%-w- 15%, title:^(Steam)$, class:^()$

### JDownloader windowrules
windowrule = tile, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, title: ^(JDownloader [0-9])$  # forces Main Window JD2 to tile (nofloat)
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, title:^(win0)$  # forces link crawler window to float
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, title:^(win3)$  # forces link right click menu to float
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, title:^(win4)$  # forces link right click menu to float
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, initialTitle:^(JDownloader-Updater)$  # forces the updater to float
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, initialTitle:^(Eine neue Aktualisierung ist verfügbar)$  # forces the updater to float
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, initialTitle:^(Bitte warten...)$  # forces the search for variants to float
# windowrule = float, initialClass:^(org-jdownloader-update-launcher-JDLauncher)$, initialTitle:^(Wähle eine Variante für [0-9]+ [A-Za-z0-9 \(\)])$  # forces the selection of variants to float

### floating windows
# PiP windows
windowrule = float, title:^([Bb]ild[- ]im[- ][Bb]ild|[Pp]icture[- ]in[- ][Pp]icture)$
windowrule = pin, title:^([Bb]ild-im-[Bb]ild|[Pp]icture-in-[Pp]icture)$
windowrule = size 853 480, title:^([Bb]ild-im-[Bb]ild|[Pp]icture-in-[Pp]icture)$
windowrule = move onscreen 50%-w- 0%, title:^([Bb]ild-im-[Bb]ild|[Pp]icture-in-[Pp]icture)$

# Thunar
# moving progress
windowrule = float, class:^(thunar)$, title:^(Dateivorgangsfortschritt)$
# rename
windowrule = float, class:^(thunar)$, title:^(».+« umbenennen)$
# rename multiple
windowrule = float, class:^(thunar)$, title:^(Mehrere .+ umbenennen)$
windowrule = size 1800 900, class:^(thunar)$, title:^(Mehrere .+ umbenennen)$

# Firefox
# delete cookies
windowrule = float, class:^(firefox)$, title:^(Cookies und Website-Daten löschen)$
windowrule = size 500 150, class:^(firefox)$, title:^(Cookies und Website-Daten löschen)$
windowrule = move onscreen 50%-w- 50%-w-, class:^(firefox)$, title:^(Cookies und Website-Daten löschen)$

# OnlyOffice
# print dialog
windowrule = float, class:^(DesktopEditors)$, title:^(Dokument drucken)$
windowrule = size 800 500, class:^(DesktopEditors)$, title:^(Dokument drucken)$
windowrule = move onscreen 50%-w- 50%-w-, class:^(DesktopEditors)$, title:^(Dokument drucken)$
# save document dialog
windowrule = float, class:^(DesktopEditors)$, title:^()$
windowrule = size 450 125, class:^(DesktopEditors)$, title:^()$
windowrule = move onscreen 50%-w- 50%-w-, class:^(DesktopEditors)$, title:^()$

# KiCad
# footprint choose
windowrule = size 1000 700, class:^(kicad)$, title:^(Footprint-Auswahl.+)$

# Wine
windowrule = float, title:^(Wine)$, class:^(wineboot.exe)$

# Blueman Manager
windowrule = float,class:^(blueman-manager)$, title:^(Bluetooth-Geräte)$
windowrule = pin,class:^(blueman-manager)$, title:^(Bluetooth-Geräte)$
windowrule = size 540 360,class:^(blueman-manager)$, title:^(Bluetooth-Geräte)$
windowrule = move onscreen 85%-w- 0%,class:^(blueman-manager)$, title:^(Bluetooth-Geräte)$

# Jellyfin Media Player
windowrule = float, title:^(Jellyfin Media Player)$
windowrule = pin, title:^(Jellyfin Media Player)$
windowrule = size 853 480, title:^(Jellyfin Media Player)$
windowrule = move onscreen 50%-w- 0%, title:^(Jellyfin Media Player)$

# MPV Player
windowrule = float, initialClass:^(mpv)$
windowrule = size 853 480, initialClass:^(mpv)$
windowrule = move onscreen 50%-w- 0%, initialClass:^(mpv)$

# Discord PiP
windowrule = float, initialTitle:^(Discord Popout)$
windowrule = pin, initialTitle:^(Discord Popout)$
windowrule = size 500 1400, initialTitle:^(Discord Popout)$
windowrule = move onscreen 0% 0%, initialTitle:^(Discord Popout)$

# GIMP export window
windowrule = float, initialClass:^(file-(jpeg|png))$
windowrule = size 920 590, initialClass:^(file-(jpeg|png))$
windowrule = move onscreen 50%-w- 50%-w-, initialClass:^(file-(jpeg|png))$

# Nextcloud sync status window
windowrule = float, initialClass:^(com.nextcloud.desktopclient.nextcloud)$, initialTitle:^(Nextcloud)$
windowrule = size 500 800, initialClass:^(com.nextcloud.desktopclient.nextcloud)$, initialTitle:^(Nextcloud)
windowrule = move onscreen 80%-w- 0%, initialClass:^(com.nextcloud.desktopclient.nextcloud)$, initialTitle:^(Nextcloud)

# KeePassXC browser permissions
windowrule = float, initialClass:^(org.keepassxc.KeePassXC)$, initialTitle:^(.* - Browser-Zugriffsanfrage)$
windowrule = size 640 200, initialClass:^(org.keepassxc.KeePassXC)$, initialTitle:^(.* - Browser-Zugriffsanfrage)$
windowrule = move onscreen 50%-w- 50%-w-, initialClass:^(org.keepassxc.KeePassXC)$, initialTitle:^(.* - Browser-Zugriffsanfrage)$

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    enable_anr_dialog = false # anr = Application not Responding
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true  # false
    }
}

# https://wiki.hypr.land/0.51.0/Configuring/Gestures/
gestures {
  gesture = 3, horizontal, workspace
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
  name = wacom-intuos-s-pen
  output = DP-2
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, R, exec, $terminal  # Q
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, M, exit, # hyprland logout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, B, togglefloating, # float/tile switch
bind = $mainMod, D, exec, $launcher  # R
bind = $mainMod, W, exec, $browser
#bind = $mainMod, V, AI_Assistant
bind = $mainMod, F, fullscreen
#bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, G, togglesplit, # rotate splitted windows (dwindle)
bind = $mainMod SHIFT, S, exec, $screenshot_area
bind = $mainMod SHIFT, H, exec, cliphist list | $launcher --dmenu | cliphist decode | wl-copy

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0


